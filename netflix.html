<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Netflix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/style.css" />
</head>
<body>
    <div class="app-background">
    <header>
    <!-- Navigation menu / Header -->

    <img src="img/logo-1.png" class="netflix-logo" alt="Netflix">
    <div class="menu">
        <a href="#" class="active">Início</a>
        <a href="#">Séries</a>
        <a href="#">Filmes</a>
        <a href="#">Bombando</a>
        <a href="#">Minha lista</a>
    </div>

    <!-- Header right elements -->
    <div class="header-right">
        <svg class="search" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>

        <svg class="notification" viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>

        <img class="user" src="img/avatar.png" alt="User profile">

        <svg class="user-selector" viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
        </svg>
    </div>

    

    </header>

    <main>
    <!-- Main content -->
    <img src="img/poster-1.png" class="movie-poster" alt="Featured movie">
    <p class="description">Em uma penitenciária de última geração, um detento participa de um experimento com drogas que controlam as emoções para um gênio da indústria farmacêutica</p>
     
    <!-- Action buttons -->
    <div class="buttons">
       <button class="button-play">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
               <path d="M6 4l15 8-15 8z"/>
            </svg>
            Assistir
        </button>
        <button class="button-info">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
            </svg>
            Mais informações
        </button>
    </div>

    <!-- Movie categories -->
    <div class="categories">
        <h2>Minha lista</h2>
        <div class="my-list movie-carousel">
            <img src="img/my-list/poster_01.png" alt="movie1">
            <img src="img/my-list/poster_02.png" alt="movie2">
            <img src="img/my-list/poster_03.png" alt="movie3">
            <img src="img/my-list/poster_04.png" alt="movie4">
            <img src="img/my-list/poster_05.png" alt="movie5">
            <img src="img/my-list/poster_06.png" alt="movie6">
            <img src="img/my-list/poster_07.png" alt="movie7">
        </div>
        <h2>Em Alta</h2>
        <div class="trending movie-carousel">
            <img src="img/trending/poster_01.png" alt="movie1">
            <img src="img/trending/poster_02.png" alt="movie2">
            <img src="img/trending/poster_03.png" alt="movie3">
            <img src="img/trending/poster_04.png" alt="movie4">
            <img src="img/trending/poster_05.png" alt="movie5">
            <img src="img/trending/poster_06.png" alt="movie6">
        </div>


    </div>
    </main>

    <footer>
    <!-- Footer -->
    </footer>
    </div>
</body>
</html>
