<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Netflix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/style.css" />
</head>
<body>
     <div class="app_background">
     <header>
     <!-- Parte de navegação do menu / Cabeçalho do site-->
     </header>

     <main>
     <!-- Corpo principal do site -->
     <img src="img/poster 1.png" class="poster">
     <p class="descricao">Em uma penitenciária de última geração, um detento participa de um experimento com drogas que controlam as emoções para um gênio da indústria farmacêutica</p>
     
     <div class="buttons">
        <button class="button-play">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M6 4l15 8-15 8z"/>
            </svg>
            Assistir
        </button>
        <button class="button-info">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
            </svg>
            Mais informações
        </button>
     </div>
     </main>

     <footer>
     <!-- Rodapé do site -->
     </footer>
     </div>
</body>
</html>
